<title>Що зібрати?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone-width app column on a studded baseplate, three tabs, fixed bottom nav. */
:root{
  --plate:#EEF1E8; --stud:#E1E6D8; --card:#FFFFFF; --card2:#F6F8F2; --ink:#1D2433; --muted:#5E6676; --line:#DDE2D4;
  --red:#D7261E; --yellow:#F6C624; --blue:#1F5FBF; --green:#2E8B57; --amber:#E08A00;
  --chip:#F1F3EC; --shadow:0 1px 0 rgba(29,36,51,.05),0 6px 18px rgba(29,36,51,.07); --nav:rgba(255,255,255,.92);
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --plate:#14171D; --stud:#1A1E26; --card:#1F242E; --card2:#252B36; --ink:#EEF0F4; --muted:#A3AAB8; --line:#2E3542;
  --chip:#2A303C; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); --nav:rgba(26,30,38,.94); color-scheme:dark}}
:root[data-theme="dark"]{
  --plate:#14171D; --stud:#1A1E26; --card:#1F242E; --card2:#252B36; --ink:#EEF0F4; --muted:#A3AAB8; --line:#2E3542;
  --chip:#2A303C; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); --nav:rgba(26,30,38,.94); color-scheme:dark}

body{background-color:var(--plate);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 14px 14px,var(--stud) 7px,transparent 7.5px);background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:460px;margin:0 auto;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:16px}
.langs{display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.langs button{border:0;background:none;padding:6px 11px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--plate)}

/* css brick (small decorative ones) */
.brick{--u:28px;--c:var(--red);position:relative;width:calc(var(--n,4)*var(--u));height:calc(var(--u)*1.1);margin-top:calc(var(--u)*.3);
  background:var(--c);border-radius:calc(var(--u)*.16);box-shadow:inset 0 calc(var(--u)*-.18) 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.2);flex:none}
.brick::before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*-.3);height:calc(var(--u)*.34);
  background:linear-gradient(to right,transparent 20%,color-mix(in srgb,var(--c) 80%,white) 20% 80%,transparent 80%);background-size:var(--u) 100%;border-radius:4px 4px 0 0}

/* hero */
.hero{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--blue) 14%,var(--card)),var(--card));border-radius:26px;box-shadow:var(--shadow);overflow:hidden;padding:18px 18px 20px}
.hero canvas{width:100%;height:210px;display:block}
.hero h1{font-size:clamp(32px,9vw,40px);line-height:1.05;margin-top:4px}
.hero p{color:var(--muted);margin-top:8px;font-size:16px;max-width:34ch}
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;
  --c:var(--red);height:60px;margin-top:22px;background:var(--c);color:#fff;border-radius:12px;font-family:var(--display);font-weight:600;font-size:19px;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.2);transition:transform .12s}
.cta::before{content:"";position:absolute;left:0;right:0;top:-10px;height:12px;
  background:linear-gradient(to right,transparent 22%,color-mix(in srgb,var(--c) 80%,white) 22% 78%,transparent 78%);background-size:calc(100%/8) 100%;border-radius:5px 5px 0 0}
.cta:active{transform:translateY(3px)}
.cta input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.ghost{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-weight:800;width:100%}
.note{font-size:13px;color:var(--muted);text-align:center}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how div{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--muted)}
.how b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:9px;color:#fff;font-family:var(--display);font-size:16px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:21px}
.sec-h button{border:0;background:none;color:var(--blue);font-weight:800;font-size:14px;padding:4px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -2px}
.rail::-webkit-scrollbar{display:none}
.pile-card{flex:0 0 72%;scroll-snap-align:start;border:0;text-align:left;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:0;overflow:hidden}
.pile-art{height:116px;position:relative;overflow:hidden}
.pile-art .mess{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px 8px;padding:8px 14px;transform:rotate(-6deg) scale(1.05)}
.pile-card .txt{padding:10px 14px 14px}
.pile-card h3{font-size:17px}
.pile-card p{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}

/* idea cards (catalog + results) */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.icard{border:0;padding:0;text-align:left;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.icard .thumb{height:118px;background:linear-gradient(180deg,var(--card2),var(--card));display:grid;place-items:center;position:relative}
.icard canvas{width:100%;height:118px;display:block}
.icard .emo-big{font-size:52px}
.icard .txt{padding:8px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.icard h3{font-size:16px;line-height:1.2}
.meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.studs{display:inline-flex;gap:3px}.studs i{width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--d) 22%,transparent)}
.studs i.on{background:var(--d)}
.done-flag{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--plate)}

.search{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-weight:700}
.search::placeholder{color:var(--muted);font-weight:600}
.chips.seg button{font-size:13px;padding:6px 11px}
/* loading */
.loading{display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:48px;text-align:center}
.drop{display:flex;flex-direction:column-reverse;align-items:center;height:130px}
.drop .brick{animation:drop 2.4s infinite both}
.drop .brick:nth-child(2){animation-delay:.25s}.drop .brick:nth-child(3){animation-delay:.5s}
@keyframes drop{0%{transform:translateY(-70px);opacity:0}18%{transform:translateY(0);opacity:1}24%{transform:translateY(-6px)}30%,85%{transform:none;opacity:1}100%{opacity:0}}
.loading .ph{width:110px;height:110px;border-radius:18px;object-fit:cover;box-shadow:var(--shadow)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-weight:700}

/* result */
.photo{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--card);box-shadow:var(--shadow)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:12px;left:12px;background:var(--yellow);color:#1D2433;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.inv-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.big{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.big small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;margin-left:4px}
.bars{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:14px;gap:2px}
.swatches{display:flex;flex-wrap:wrap;gap:12px 14px;margin-top:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:700}
.sw .brick{--u:16px;--n:2}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--chip);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700}
.tag.hl{background:color-mix(in srgb,var(--yellow) 32%,transparent)}
.warn{background:color-mix(in srgb,var(--amber) 14%,var(--card))}
.err{background:color-mix(in srgb,var(--red) 12%,var(--card));border-radius:14px;padding:12px 14px;font-weight:700}

/* detail */
.back{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:800;align-self:flex-start}
.stage{position:relative;background:radial-gradient(120% 90% at 50% 20%,color-mix(in srgb,var(--blue) 12%,var(--card)),var(--card) 70%);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.stage canvas{width:100%;height:280px;display:block}
.stage{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.stage .flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .16s}
.stage .flash.l{background:linear-gradient(to right,color-mix(in srgb,var(--ink) 12%,transparent),transparent 55%);opacity:1}
.stage .flash.r{background:linear-gradient(to left,color-mix(in srgb,var(--ink) 12%,transparent),transparent 55%);opacity:1}
.stage .flash.end{background:linear-gradient(to left,color-mix(in srgb,var(--red) 16%,transparent),transparent 55%);opacity:1}
.stage .arrow{position:absolute;top:calc(50% - 30px);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;pointer-events:none;
  background:color-mix(in srgb,var(--card) 85%,transparent);box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--ink);font-size:22px;font-weight:800;opacity:.55;transition:opacity .16s,transform .16s}
.stage .arrow.al{left:8px}.stage .arrow.ar{right:8px}.stage .arrow.on{opacity:1;transform:scale(1.15)}.stage .arrow.off{opacity:0}
.stage .arrow.fin{color:var(--red)}
.stage .hint{position:absolute;left:12px;right:12px;bottom:30px;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);background:color-mix(in srgb,var(--ink) 86%,transparent);color:var(--plate);
  font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;text-align:center;pointer-events:none}
.next.pulse{animation:pulse .35s ease}
@keyframes pulse{40%{transform:scale(1.07)}}
/* stage corner buttons */
.stage .sbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.rbtn{width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12);
  display:grid;place-items:center;font-size:19px;font-weight:800;cursor:pointer;padding:0}
.rbtn.on{background:color-mix(in srgb,var(--yellow) 40%,var(--card))}
.bmopen{width:100%;border:0;border-radius:14px;padding:13px;background:color-mix(in srgb,var(--blue) 12%,var(--card));color:var(--blue);font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer}
.again{border:0;background:none;color:var(--muted);font-weight:700;text-decoration:underline;cursor:pointer;align-self:center}
.favbtn{position:absolute;right:0;top:0;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:22px;cursor:pointer}
.ptag{position:absolute;top:8px;left:8px;background:var(--blue);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px}
.fheart{position:absolute;bottom:6px;right:8px;font-size:15px}
.rand{border:0;background:none;color:var(--blue);font-weight:800;font-size:14px;cursor:pointer;padding:6px 4px;white-space:nowrap}
/* full-screen build mode */
.bm{position:fixed;inset:0;z-index:80;background:radial-gradient(90% 60% at 50% 40%,color-mix(in srgb,var(--blue) 13%,var(--card)),var(--plate));display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.bm.anim{animation:bmin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes bmin{from{opacity:0;transform:scale(.97)}}
.bm .segs{display:flex;gap:4px}.bm .segs i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .2s}
.bm .segs i.on{background:var(--green)}.bm .segs i.cur{background:var(--ink)}
.bm .top{display:flex;align-items:center;gap:10px;margin-top:10px}
.bm .top .tt{flex:1;min-width:0}.bm .top .tt b{display:block;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm .top .tt span{font-size:13px;font-weight:800;color:var(--muted)}
.bm .zone{position:relative;flex:1;min-height:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.bm .zone canvas{position:absolute;inset:0;width:100%;height:100%}
.bm .zone .flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .16s}
.bm .zone .flash.l{background:linear-gradient(to right,color-mix(in srgb,var(--ink) 12%,transparent),transparent 55%);opacity:1}
.bm .zone .flash.r{background:linear-gradient(to left,color-mix(in srgb,var(--ink) 12%,transparent),transparent 55%);opacity:1}
.bm .zone .flash.end{background:linear-gradient(to left,color-mix(in srgb,var(--red) 16%,transparent),transparent 55%);opacity:1}
.bm .zone .arrow{position:absolute;top:calc(50% - 20px);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;pointer-events:none;background:color-mix(in srgb,var(--card) 85%,transparent);
  box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:24px;font-weight:800;opacity:.55;transition:opacity .16s,transform .16s}
.bm .zone .al{left:0}.bm .zone .ar{right:0}.bm .zone .arrow.on{opacity:1;transform:scale(1.15)}.bm .zone .arrow.off{opacity:0}.bm .zone .arrow.fin{color:var(--red)}
.bm .zone .hint{position:absolute;left:0;right:0;top:8px;margin:0 auto;width:fit-content;max-width:90%;background:color-mix(in srgb,var(--ink) 86%,transparent);color:var(--plate);font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;pointer-events:none;text-align:center}
.bm .panel{margin:0 calc(-1 * max(12px,env(safe-area-inset-left,0px)));background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;transition:margin .25s}
.bm .panel.hide{margin-bottom:-260px}
.bm .grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line);border:0;cursor:pointer;padding:0}
.bm .panel .st{font-size:19px;font-weight:800;line-height:1.25}
.bm .panel .sh{font-size:13.5px;font-weight:700;color:var(--muted);margin-top:-6px}
.bm .panel .chipsrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.bm .panel .chipsrow::-webkit-scrollbar{display:none}
.bm .panel .chipsrow .part{flex:none}
.bm .showpanel{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--plate);font-weight:700;font-size:14px;
  padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toast 2.2s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.stage .emo-stage{height:220px;display:grid;place-items:center;font-size:96px}
.stage .stepno{position:absolute;top:12px;left:12px;background:var(--ink);color:var(--plate);font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;justify-content:center;padding:0 0 14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{background:var(--green)}.dots i.cur{width:22px;border-radius:4px;background:var(--ink)}
.steptext{font-size:19px;font-weight:700;line-height:1.35;min-height:52px}
.added{display:flex;flex-wrap:wrap;gap:8px}
.part{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:10px;padding:4px 10px 4px 6px;font-size:13px;font-weight:700}
.part .brick{--u:11px;margin-top:3px}
.nav2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.nav2 button{border:0;border-radius:14px;padding:14px;font-family:var(--display);font-weight:600;font-size:17px}
.prev{background:var(--card);box-shadow:var(--shadow)}
.next{background:var(--green);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.next.finish{background:var(--red)}
.prev:disabled{opacity:.4}
.parts-all{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checklist label{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 4px;border-radius:10px;cursor:pointer}
.checklist input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green)}
.checklist input:checked+span{text-decoration:line-through;color:var(--muted)}

/* my builds */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);font-size:12.5px;font-weight:800;line-height:1.25}
.bdg .ic{font-size:30px;display:block;margin-bottom:4px}
.bdg.locked{opacity:.45;filter:grayscale(1)}
.bdg small{display:block;font-weight:600;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:800;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.tabs .cnt{position:absolute;margin-left:22px;margin-top:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}


/* launch splash (two acts: Koreec → app) */
#splash{position:fixed;inset:0;z-index:100;background:var(--plate);overflow:hidden;cursor:pointer;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.03);pointer-events:none}
#splash>*{position:absolute;will-change:transform,opacity}
#splash .studs{inset:0;background-image:radial-gradient(circle at 14px 14px,var(--stud) 7px,transparent 7.5px);background-size:28px 28px;opacity:0}
#splash .glow{width:340px;height:340px;border-radius:50%;left:50%;margin-left:-170px}
#splash .knot{left:50%;height:auto}
#splash .word{left:50%;height:auto}
#splash .from{left:0;right:0;text-align:center;font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--muted);opacity:0}
#splash .app{left:0;right:0;display:flex;flex-direction:column;align-items:center;opacity:0}
#splash .app canvas{width:240px;height:260px;margin-top:-40px}
#splash .app h1{font-size:40px;margin-top:-12px}
#splash .app p{color:var(--muted);font-weight:700;margin-top:10px}
#splash canvas.tw{pointer-events:none}
#splash .dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #splash .lt{display:none}:root:not([data-theme="light"]) #splash .dk{display:block}}
:root[data-theme="dark"] #splash .lt{display:none}:root[data-theme="dark"] #splash .dk{display:block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.credits{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

async function analyze(file){
  if(view.url)URL.revokeObjectURL(view.url);
  const url=URL.createObjectURL(file);tab="scan";view={name:"loading",url};render();window.scrollTo(0,0);
  ctl=new AbortController();
  try{const data=await sample.json(PROMPT(lang),{images:[file],signal:ctl.signal});
    if(!data||typeof data!=="object")throw{code:"invalid_json"};
    view={name:"result",data,url};
  }catch(e){URL.revokeObjectURL(url);const code=e?.code;
    if(["not_granted","images_unavailable","sampling_disabled"].includes(code))imgOk=false;
    view={name:"home",error:code==="cancelled"?null:(T[lang]["e_"+code]?t("e_"+code):t("e_generic"))};}
  render();window.scrollTo(0,0);
}

/* ================= launch splash ================= */
(function(){
  const el=$("#splash"); if(!el) return;
  const SPL={uk:["Що зібрати?","Купка деталей → нова модель","ВІД"],pl:["Co zbudować?","Stos klocków → nowy model","OD"],en:["What to build?","A pile of bricks → a new model","FROM"]}[lang];
  $("#splashTitle").textContent=SPL[0];$("#splashTag").textContent=SPL[1];$("#splashFrom").textContent=SPL[2];
  const logo=expand([[[0,0,0,4,2,"R",1]],[[1,0,1,2,2,"Y",1]]]), cv=$("#splashLogo"), tw=el.querySelector("canvas.tw");
  const knots=el.querySelectorAll(".knot"), words=el.querySelectorAll(".word"), glow=el.querySelector(".glow"), studs=el.querySelector(".studs"), app=el.querySelector(".app"), from=$("#splashFrom");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches, DUR=reduce?900:3400;
  const KA=535/299, WA=593/153;
  const cl=x=>Math.min(1,Math.max(0,x)), lerp=(a,b,t)=>a+(b-a)*t;
  const out3=x=>1-Math.pow(1-x,3), io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, inQ=x=>x*x;
  const backOut=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
  const bounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375;};
  const seg=(t,a,b,f=out3)=>f(cl((t-a)/(b-a)));
  let t0=null, ended=false;
  function end(){if(ended)return;ended=true;el.classList.add("out");setTimeout(()=>el.remove(),500);}
  const SP=[[.12,.22],[.88,.18],[.06,.70],[.94,.74],[.30,.04],[.70,.96],[.5,.5]], TINT=["255,255,255","159,230,240","232,180,138"];
  function frame(now){ if(ended)return; t0??=now; const v=Math.min(1,(now-t0)/DUR);
    const w=el.clientWidth,h=el.clientHeight,cy=h*.40;
    // act A
    const settle=reduce?1:seg(v,0,.16,backOut), knotW=lerp(150,230,settle), knotH=knotW/KA;
    const sweep=seg(v,.10,.32,io3), dissolve=seg(v,.38,.50,inQ);
    const twinkle=v<.44?seg(v,.08,.20)*(1-seg(v,.34,.44)):0, wordIn=seg(v,.14,.30), move=seg(v,.40,.56,io3), fromIn=seg(v,.52,.64);
    const wordW=lerp(250,170,move), wordH=wordW/WA, wordTopB=h-28-wordH, wordTop=lerp(cy+230/KA/2+26,wordTopB,move)+14*(1-wordIn);
    knots.forEach(k=>{k.style.width=knotW+"px";k.style.left=(w/2-knotW/2)+"px";k.style.top=(cy-knotH/2)+"px";k.style.opacity=1-dissolve;
      k.style.transform=`scale(${1+.15*dissolve})`;k.style.filter=`blur(${8*dissolve}px) brightness(${1+(reduce?0:.35*Math.max(0,1-Math.abs(sweep-.5)*3))})`;});
    words.forEach(x=>{x.style.width=wordW+"px";x.style.left=(w/2-wordW/2)+"px";x.style.top=wordTop+"px";x.style.opacity=wordIn;});
    from.style.top=(wordTopB-24)+"px";from.style.opacity=fromIn;
    // act B
    const u=seg(v,.44,1,x=>x), appIn=seg(u,0,.14), up=seg(u,.14,.28), down=bounce(cl((u-.28)/.20));
    const lift=reduce?0:(u<.28?up*1.6:(1-down)*1.6), pop=reduce?1:.6+.4*backOut(cl(u/.2));
    const title=seg(u,.36,.58), tag=seg(u,.46,.68), burst=seg(u,.46,.72);
    studs.style.opacity=seg(v,.40,.75);
    const a1=.26*Math.max(settle*(1-dissolve*.6),appIn), gc=move<.5?"127,211,224":"246,198,36";
    glow.style.top=(cy-170)+"px";glow.style.background=`radial-gradient(circle,rgba(${gc},${a1}),transparent 70%)`;
    app.style.top=(cy-130)+"px";app.style.opacity=appIn>0?1:0;
    if(appIn>0){cv.style.opacity=appIn;cv.style.transform=`scale(${pop})`;drawModel(cv,logo,{cur:1,drop:lift,maxA:44,pad:18,dy:30});
      const g=cv.getContext("2d");
      if(!reduce&&burst>0&&burst<1){const W=cv.clientWidth,H=cv.clientHeight,cx=W/2,cyy=H*.5,cols=["#D7261E","#F6C624","#1F5FBF","#2E8B57"];
        for(let i=0;i<10;i++){const an=-Math.PI/2+(i-4.5)*.33,r=40+95*burst;g.globalAlpha=1-burst;g.fillStyle=cols[i%4];g.beginPath();g.arc(cx+Math.cos(an)*r,cyy+Math.sin(an)*r,6*(1-burst*.5),0,7);g.fill();}g.globalAlpha=1;}}
    const ti=$("#splashTitle"),tg=$("#splashTag");ti.style.opacity=title;ti.style.transform=`translateY(${18*(1-title)}px)`;tg.style.opacity=tag;tg.style.transform=`translateY(${12*(1-tag)}px)`;
    // twinkles
    const TW=knotW+60,TH=knotH+60; tw.style.left=(w/2-TW/2)+"px";tw.style.top=(cy-TH/2)+"px";tw.style.width=TW+"px";tw.style.height=TH+"px";
    const dpr=Math.min(devicePixelRatio||1,2); tw.width=TW*dpr;tw.height=TH*dpr; const g2=tw.getContext("2d"); g2.setTransform(dpr,0,0,dpr,0,0);g2.clearRect(0,0,TW,TH);
    if(!reduce&&twinkle>0) SP.forEach(([x,y],i)=>{const ph=Math.abs(Math.sin((v*9+i*1.7)*Math.PI)),al=Math.min(1,twinkle*(.35+.65*ph)),r=5+5*ph,cx=x*TW,cyy=y*TH;
      g2.fillStyle=`rgba(${TINT[i%3]},${al})`;g2.beginPath();g2.moveTo(cx,cyy-r);g2.quadraticCurveTo(cx,cyy,cx+r,cyy);g2.quadraticCurveTo(cx,cyy,cx,cyy+r);g2.quadraticCurveTo(cx,cyy,cx-r,cyy);g2.quadraticCurveTo(cx,cyy,cx,cyy-r);g2.fill();});
    if(v<1) requestAnimationFrame(frame); else end();
  }
  el.addEventListener("click",end);
  requestAnimationFrame(frame);
})();
(async()=>{try{sample=await window.claude?.use?.("sample");const lim=sample?await sample.limits().catch(()=>null):null;imgOk=!!lim?.images;}catch(e){imgOk=false;}
