name: what_to_build
description: "Що зібрати? — фото купки конструктора → ідеї моделей з 3D-збіркою. © by Greater Koreec Project Group"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/brand/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#EEF1E8"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#EEF1E8"
  image: assets/icon/splash.png
  color_dark: "#14171D"
  image_dark: assets/icon/splash_dark.png
  android_12:
    color: "#EEF1E8"
    image: assets/icon/splash_android12.png
    color_dark: "#14171D"
    image_dark: assets/icon/splash_android12_dark.png
