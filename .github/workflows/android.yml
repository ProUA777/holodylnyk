name: Android build

on:
  push:
    branches: [main, what-to-build]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Create and configure android/ios
        run: dart run tool/setup_platforms.dart
      - run: flutter analyze
      - run: flutter test
      - name: Release signing (only if the keystore secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Build APK and App Bundle
        run: |
          flutter build apk --release --dart-define=API_BASE=${{ secrets.API_BASE || 'http://10.0.2.2:8000' }} --dart-define=APP_KEY=${{ secrets.APP_KEY || 'dev-key-bricks' }}
          flutter build appbundle --release --dart-define=API_BASE=${{ secrets.API_BASE || 'http://10.0.2.2:8000' }} --dart-define=APP_KEY=${{ secrets.APP_KEY || 'dev-key-bricks' }}
      - uses: actions/upload-artifact@v4
        with:
          name: what-to-build-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
