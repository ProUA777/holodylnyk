# Автоматична збірка без власного ПК/Mac: кожен push у GitHub
#  • тестує бекенд
#  • збирає APK для Android (завантажується з вкладки Actions → Artifacts)
#  • збирає iOS-версію на Mac від GitHub (перевірка, що все компілюється під iPhone)
# Адреса сервера й ключ апки беруться з Settings → Secrets and variables → Actions:
#   API_URL  (напр. https://api.твійдомен.com)   API_KEY  (той самий, що PHOTOAI_API_KEYS)
name: build

on:
  push:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: recipes_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash setup.sh
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: >
          flutter build apk --release
          --dart-define=API_URL=${{ secrets.API_URL }}
          --dart-define=API_KEY=${{ secrets.API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: shcho-pryhotuvaty-android
          path: recipes_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: recipes_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash setup.sh
      - run: >
          flutter build ios --release --no-codesign
          --dart-define=API_URL=${{ secrets.API_URL }}
          --dart-define=API_KEY=${{ secrets.API_KEY }}
